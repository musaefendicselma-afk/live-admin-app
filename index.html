<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Admin Status Panel</h1>

        <!-- Polje za ime administratora -->
        <input type="text" id="adminName" placeholder="Unesi svoje ime" style="margin-bottom: 10px; padding: 5px;">

        <div id="status-box">Učitavam...</div>

        <!-- Ovdje ćemo prikazati vrijeme -->
        <div id="time-box" style="font-size: 0.9em; color: gray; margin-bottom: 15px;"></div>

        <button id="testBtn">Ažuriraj Status</button>
    </div>

    <!-- Veza sa tvojim JavaScript fajlom -->
    <script type="module" src="app.js"></script>
</body>

</html>
