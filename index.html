<!DOCTYPE html>
<html lang="bs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Natron Hayat</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="sidebar">
        <h2 class="logo">EVIDENCIJE</h2>

        <!-- GLAVNI MODUL: VOZILA -->
        <div class="menu-group">
            <button class="main-tab" onclick="toggleSubmenu('vozila-sub')">VOZILA ▾</button>
            <div id="vozila-sub" class="submenu">
                <button class="sub-link" onclick="showModule('putni-nalog')">Putni nalog</button>
                <button class="sub-link" onclick="showModule('ovlastenje')">Ovlaštenje za upravljanje</button>
                <button class="sub-link" onclick="showModule('potrosnja')">Potrošnja goriva</button>
            </div>
        </div>

        <!-- OSTALI GLAVNI MODULI -->
        <button class="main-tab no-sub" onclick="showModule('odluke')">ODLUKE</button>
        <button class="main-tab no-sub" onclick="showModule('posta')">POŠTA</button>
        <button class="main-tab no-sub" onclick="showModule('prevodi')">PREVODI</button>
    </div>

    <div class="main-content">
        <!-- POČETNI EKRAN -->
        <div id="welcome-screen" class="module">
            <h1>Dobrodošli u Administrativni Panel</h1>
            <p>Izaberite kategoriju iz menija za početak unosa podataka.</p>
        </div>

        <!-- MODUL: PUTNI NALOG -->
        <div id="putni-nalog" class="module" style="display:none;">
            <h1>Putni Nalozi</h1>
            <div class="input-form">
                <input type="text" id="pn-vozilo" placeholder="Vozilo (Model/Tablice)">
                <input type="text" id="pn-relacija" placeholder="Relacija (Od - Do)">
                <input type="text" id="pn-svrha" placeholder="Svrha putovanja">
                <input type="number" id="pn-km" placeholder="Početna KM">
                <input type="time" id="pn-vrijeme" title="Vrijeme polaska">
                <input type="text" id="pn-odobrio" placeholder="Nalog izdao/odobrio">
                <button onclick="spasiPutniNalog()">Evidentiraj Nalog</button>
            </div>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>Vozilo</th>
                        <th>Relacija</th>
                        <th>Svrha</th>
                        <th>Vrijeme</th>
                        <th>Odobrio</th>
                        <th>KM</th>
                        <th>Datum</th>
                    </tr>
                </thead>
                <tbody id="lista-putnih-naloga">
                    <!-- Ovdje će se pojavljivati unosi -->
                </tbody>
            </table>
        </div>

        <!-- OSTALI MODULI (PROSTORI ZA BUDUĆI RAD) -->
        <div id="ovlastenje" class="module" style="display:none;">
            <h1>Ovlaštenja</h1>
            <p>Modul u pripremi...</p>
        </div>
        <div id="potrosnja" class="module" style="display:none;">
            <h1>Potrošnja goriva</h1>
            <p>Modul u pripremi...</p>
        </div>
        <div id="odluke" class="module" style="display:none;">
            <h1>Odluke</h1>
            <p>Modul u pripremi...</p>
        </div>
    </div>

    <script src="app.js" type="module"></script>
</body>

</html>
